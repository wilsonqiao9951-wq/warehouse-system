services:
  api:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DATABASE_URL: postgresql+psycopg://mycoke:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mycoke
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a unique random JWT_SECRET_KEY}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?Set the actual frontend URL}
    expose:
      - '8000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycoke
      POSTGRES_USER: mycoke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mycoke -d mycoke']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set your API domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  database:
  uploads:
  certificates:
  caddy_config:
