name: openpartsflow

x-api-environment: &api-environment
  APP_ENV: production
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:?Set DEPLOYMENT_REGION in .env.production}
  APP_DEBUG: "false"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
  MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?Set MFA_ENCRYPTION_KEYS in .env.production}
  INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS: ${INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS:?Set INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS in .env.production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?Set FRONTEND_PUBLIC_URL in .env.production}
  CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
  DATA_EXPORT_PUBLIC_FILES_ROOT: /app/data/uploads
  DATA_EXPORT_PRIVATE_FILES_ROOT: /app/data/private
  DATA_RESTORE_ROLLBACK_FILES_ROOT: /app/data/rollbacks
  RBAC_ENFORCE: "true"
  LEGACY_HEADER_AUTH: "false"
  OPERATIONS_ALERT_DELIVERY_ENABLED: ${OPERATIONS_ALERT_DELIVERY_ENABLED:-false}
  OPERATIONS_ALERT_DELIVERY_POLL_SECONDS: ${OPERATIONS_ALERT_DELIVERY_POLL_SECONDS:-60}
  OPERATIONS_ALERT_WEBHOOK_URL: ${OPERATIONS_ALERT_WEBHOOK_URL:-}
  OPERATIONS_ALERT_WEBHOOK_SECRET: ${OPERATIONS_ALERT_WEBHOOK_SECRET:-}
  OPERATIONS_ALERT_MIN_SEVERITY: ${OPERATIONS_ALERT_MIN_SEVERITY:-critical}
  OPERATIONS_ALERT_REMINDER_MINUTES: ${OPERATIONS_ALERT_REMINDER_MINUTES:-60}
  OPERATIONS_ALERT_REQUEST_TIMEOUT_SECONDS: ${OPERATIONS_ALERT_REQUEST_TIMEOUT_SECONDS:-10}
  OPERATIONS_ALERT_MAX_RESPONSE_BYTES: ${OPERATIONS_ALERT_MAX_RESPONSE_BYTES:-4096}

x-migration-environment: &migration-environment
  <<: *api-environment
  DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env.production}

x-api-security: &api-security
  read_only: true
  user: "10001:10001"
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging: &bounded-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openpartsflow}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-openpartsflow_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-openpartsflow_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-openpartsflow-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data
    logging: *bounded-logging

  migrate:
    <<: *api-security
    image: openpartsflow-api:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        OPENPARTSFLOW_VERSION: ${IMAGE_TAG:-local}
        VCS_REF: ${VCS_REF:-unknown}
    env_file:
      - ${OPENPARTSFLOW_ENV_FILE:-.env.production}
    environment: *migration-environment
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  api:
    <<: *api-security
    image: openpartsflow-api:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        OPENPARTSFLOW_VERSION: ${IMAGE_TAG:-local}
        VCS_REF: ${VCS_REF:-unknown}
    env_file:
      - ${OPENPARTSFLOW_ENV_FILE:-.env.production}
    environment: *api-environment
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/data/uploads
      - private_uploads:/app/data/private
      - restore_rollbacks:/app/data/rollbacks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - data

  web:
    image: openpartsflow-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_AUTH_SESSION_MODE: ${PUBLIC_AUTH_SESSION_MODE:-auto}
        OPENPARTSFLOW_VERSION: ${IMAGE_TAG:-local}
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OPENPARTSFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
    logging: *bounded-logging

  recovery-backup:
    image: openpartsflow-recovery:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.recovery
    profiles: ["recovery"]
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env.production}
      VCS_REF: ${VCS_REF:-unknown}
    command:
      - create
      - --output-root
      - /recovery
      - --public-root
      - /source/public
      - --private-root
      - /source/private
      - --rollback-root
      - /source/rollback
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/source/public:ro
      - private_uploads:/source/private:ro
      - restore_rollbacks:/source/rollback:ro
      - ${PLATFORM_RECOVERY_ROOT:?Set PLATFORM_RECOVERY_ROOT in .env.production}:/recovery
    networks:
      - data
    restart: "no"
    logging: *bounded-logging

  recovery-rehearsal:
    image: openpartsflow-recovery:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.recovery
    profiles: ["recovery"]
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env.production}
      TARGET_DATABASE_URL: ${TARGET_DATABASE_URL:-}
    command:
      - restore-rehearsal
      - --recovery-point
      - ${RECOVERY_POINT_PATH:-/recovery/CHANGE_ME}
      - --target-public-root
      - /target/public
      - --target-private-root
      - /target/private
      - --target-rollback-root
      - /target/rollback
      - --report
      - ${RECOVERY_REPORT_PATH:-/reports/rehearsal-report.json}
      - --confirm-isolated-rehearsal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${PLATFORM_RECOVERY_ROOT:?Set PLATFORM_RECOVERY_ROOT in .env.production}:/recovery:ro
      - ${PLATFORM_RECOVERY_REPORT_ROOT:?Set PLATFORM_RECOVERY_REPORT_ROOT in .env.production}:/reports
    tmpfs:
      - /target:size=2048m,mode=0700,uid=10001,gid=10001
    networks:
      - data
    restart: "no"
    logging: *bounded-logging

volumes:
  postgres_data:
  uploads:
  private_uploads:
  restore_rollbacks:

networks:
  edge:
  data:
    internal: true
