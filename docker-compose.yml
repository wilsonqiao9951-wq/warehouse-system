services:
  openpartsflow-api:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./openpartsflow.db}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
