name: Muse backend task
description: Specify a backend change and its acceptance criteria
title: '[Muse] '
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: API inputs, outputs, roles and model/organization scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance examples and tests
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic examples or public source references
      description: Do not include passwords, tokens, customer records or private work orders.
