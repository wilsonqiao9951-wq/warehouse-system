name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.install_catalog_bundle
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - run: pytest -q

  backend-postgres-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mycoke_ci
          POSTGRES_USER: mycoke_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycoke_ci -d mycoke_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      DATABASE_URL: postgresql+psycopg://mycoke_ci:ephemeral-ci-only@127.0.0.1:5432/mycoke_ci
      JWT_SECRET_KEY: ephemeral-ci-only-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image and verify bundled catalog
        run: docker build -t mycoke-backend-ci .
      - name: Start backend and migrate fresh PostgreSQL
        run: >-
          docker run -d --name mycoke-backend-ci --network host
          -e APP_ENV -e APP_DEBUG -e DATABASE_URL -e JWT_SECRET_KEY
          mycoke-backend-ci
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/muse > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs mycoke-backend-ci
          exit 1
      - name: Verify real HTTP technician and review workflow
        run: |
          docker exec mycoke-backend-ci python -m scripts.verify_live_muse
          docker exec mycoke-backend-ci python -m scripts.verify_live_quest
          docker exec mycoke-backend-ci python -m scripts.verify_live_abs
          docker exec mycoke-backend-ci python -m scripts.verify_live_ed
          docker exec mycoke-backend-ci python -m scripts.verify_live_md
          docker exec mycoke-backend-ci python -m scripts.verify_live_df
          docker exec mycoke-backend-ci python -m scripts.verify_live_db
          docker exec mycoke-backend-ci python -m scripts.verify_live_icecombo
          docker exec mycoke-backend-ci python -m scripts.verify_live_crewserve
      - name: Container logs
        if: failure()
        run: docker logs mycoke-backend-ci
      - name: Stop backend
        if: always()
        run: docker rm -f mycoke-backend-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
